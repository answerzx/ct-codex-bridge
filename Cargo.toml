[package]
name = "ct-codex-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
argon2 = "0.5"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
hex = "0.4"
hmac = "0.12"
http = "1.1"
rand = "0.8"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml_edit = "0.22"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3.13"
